<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanna&#129655 </title>
  <style>
    body {
      background-color: lightblue;
      margin: 0;
      overflow: hidden;
      color: rgb(32, 74, 111);
      /*text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff,
               1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff;*/
    }

    .confetti {
      position: absolute;
      width: 2rem;
      height: 2rem;

      /*background: red;
      opacity: 0.8;*/
    }

    #innhold {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 1rem;
      justify-items: center;
    }

    h1 {
      font-size: 3rem;
      grid-column: 1/-1;
      justify-self: center;
    }

    p {
      font-size: x-large;
    }

    #knapper {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      width: 100%;
    }

    #knapper p {
      font-size: large;
      padding-left: 0.625rem;
      font-weight: bold;

    }

    a button {
      height: 6.25rem;
      width: 100%;
      border-radius: 10px;
      background-color: rgb(32, 74, 111);
      border: 2px solid white;
      color: white;
      font-weight: bold;
      font-size: large;
    }

    a button:hover {
      font-size: larger;
    }

    #bilde-container {
      display: flex;
      flex-direction: column;

    }

    #bilde {
      padding-top: 3rem;
      width: auto;
    }

    #bilde:hover {
      transform: scale(1.1);
    }

    .badge {
      background-color: #ff4757;
      /* Sterk farge, f.eks. rød */
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 10px;
      position: absolute;
    }



    #dyr {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #dyr img {
      width: 25rem;
    }

    #lue {
      display: none;
      /*grid-template-columns: auto auto;*/
      z-index: 1;
      position: absolute;
      border: 4px solid black;
      gap: 5px;
      padding: 10px;
      background-color: antiquewhite;
      border-radius: 15px;
      justify-self: center;
    }

    #endreTema {
      z-index: 1;
      position: absolute;
      right: 0;
      margin-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;

    }

    #endreTema a {
      border-radius: 15px;
      font-size: large;
      background-color: lightblue;
      color: rgb(32, 74, 111);
      padding: 10px;
      text-decoration: none;
      border: 2px solid rgb(32, 74, 111);
    }

    #endreTema a:hover {
      transform: scale(1.05);
    }
  </style>
</head>


<body>

  <div id="innhold">

    <h1>Gratulerer med dagen babe!!! &#129395 &#128151 &#128151</h1>

    <div id="endreTema">
      <a href="bursdag.html">Tilbake til bursdagstema (gammel) &#127881</a>
      <a style="background-color:lightblue" href="jul.html">Tilbake til juletema &#127877</a>
    </div>


    <div id="lue">
      <video id="video" height="550px" controls src="bilder/fremside/andGMDhanna.mp4"></video>
      <a href=""><button id="fjernLue">Tilbake</button>
      </a>
    </div>

    <div id="bilde-container">
      <p>Veldig veldig veldig veldig glad i deg!!!!!!</p>
      <img id="bilde" src="bilder/fremside/andgif.gif" alt="and">

    </div>


    <img height="550rem" src="bilder/fremside/grandiosa.jpg" alt="kjæresten min :D">


    <div id="knapper">
      <p>Klikk her dersom...</p>
      <a href="jeg.html">
        <button>
          Du vil vite hva jeg synes om deg &#128525
        </button></a>

      <a href="gud.html"><button>
          Du vil vite hva Gud synes om deg &#128519
        </button></a>
      <a href="bilde.html">
        <button>
          Du vil se flere bilder &#128526
          <span id="ny" class="badge">Ny</span>
        </button></a>
      <a href="overraskelse.html">
        <button>
          Du vil ha en overraskelse &#129325
        </button></a>
    </div>

  </div>

  <script>

    const bilde = document.getElementById("bilde");
    const lue = document.getElementById("lue");
    const video = document.getElementById("video");
    bilde.addEventListener("click", () => {
      lue.style.display = "flex";
      lue.style.flexDirection = "column";
      video.autoplay = true;
    });
    const lueKnapp = document.getElementById("fjernLue");
    lueKnapp.addEventListener("click", () => {
      lue.style.display = "none";
      video.autoplay = false;
    })

  </script>
</body>

</html>
