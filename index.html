<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanna&#129655 </title>
  <style>
    body {
      background-color: rgb(1, 122, 1);
      margin: 0;
      overflow: hidden;
      color: white;
      /*text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff,
               1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff;*/
    }

    .confetti {
      position: absolute;
      width: 2rem;
      height: 2rem;
     
      /*background: red;
      opacity: 0.8;*/
    }

    #innhold {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 1rem;
    }

    h1 {
      font-size: 3rem;
      grid-column: 1/-1;
      justify-self: center;
    }

    #knapper {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    #knapper p {
      font-size: large;
      padding-left: 0.625rem;
      font-weight: bold;
    }

    a button {
      height: 6.25rem;
      width: 100%;
      border-radius: 10px;
      background-color: red;
      border: 2px solid white;
      color: white;
      font-weight: bold;
      font-size: large;
    }

    a button:hover {
      font-size: larger;
    }

    #bilde-container {
      display: flex;
      justify-content: center;

    }

    #bilde {
      padding-top: 3rem;
      width: 25rem;
      height: auto;
    }

    #bilde:hover {
      transform: scale(1.1);
    }

    #dyr {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #dyr img {
      width: 25rem;
    }

    #lue {
      display: none;
      grid-template-columns: auto auto;
      z-index: 1;
      position: absolute;
      border: 4px solid black;
      gap: 5px;
      padding: 10px;
      background-color: antiquewhite;
      border-radius: 15px;
    }
    #endreTema{
      z-index: 1;
      position: absolute;
      right: 0;
      margin-right: 10px;
      border-radius: 15px;
      font-size: large;
      background-color: pink;
      color: white;
      padding: 10px;
      text-decoration: none;
      border: 2px solid white;
    }
    #endreTema:hover{
      transform: scale(1.1);
    }
  </style>
</head>


<body>

  <div id="confetti-container"></div>

  <div id="innhold">

    <h1>God Jul Hanna &lt3</h1>
    <p style=" font-size:large; grid-column: 1/-1;
      justify-self: center;">Klikk på juletreet for å åpne gaven</p>

    <a id="endreTema" href="bursdag.html"  >Tilbake til bursdagstema &#127881</a>

    <div id="lue">
      <img style="width: 20rem;" src="bilder/fremside/rodlue.jpg" alt="">
      <img style="height:26rem" src="bilder/fremside/lueforklaring.png" alt="">
      <a href=""><button id="fjernLue">Tilbake</button>
      </a>
      <a target="_blank" style="text-align: center; font-size: large;" href="https://www.instagram.com/turtelluer/">
        <button>Sjekk ut luene på instagram her!</button></a>


    </div>

    <div id="knapper">
      <p>Klikk her dersom...</p>
      <a href="jeg.html">
        <button>
          Du vil vite hva jeg synes om deg &#128525
        </button></a>

      <a href="gud.html"><button>
          Du vil vite hva Gud synes om deg &#128519
        </button></a>
      <a href="bilde.html">
        <button>
          Du vil se flere bilder &#128526
        </button></a>
      <a href="overraskelse.html">
        <button>
          Du vil ha en overraskelse &#129325
        </button></a>


    </div>

    <div id="bilde-container">
      <img id="bilde" src="bilder/fremside/juletre.webp" alt="kjæresten min :D">
    </div>
    <div id="dyr">
      <img id="zebra" src="bilder/fremside/zebrajul.gif" alt="">
      <img src="bilder/fremside/jultiger.jpeg" alt="">
    </div>


  </div>

  <script>
    const container = document.getElementById('confetti-container');

    function createConfetti() {
      const confetti = document.createElement('img');
      confetti.src = 'bilder/snofnugg/snofnugg' + Math.floor(Math.random() * 3) + '.png';
      confetti.classList.add('confetti');

      // Tilfeldig startposisjon og farge
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      //confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;

      // Legg til i container
      container.appendChild(confetti);

      // Animasjon med tilfeldig fallhastighet
      const fallDuration = Math.random() * 5 + 5; // 2–5 sek
      confetti.style.transition = `transform ${fallDuration}s linear`;

      requestAnimationFrame(() => {
        confetti.style.transform = `translateY(${window.innerHeight + 10}px) rotate(${Math.random() * 360}deg)`;
      });

      // Fjern konfettien når den har falt
      setTimeout(() => {
        confetti.remove();
      }, fallDuration * 1000);
    }

    // Lag kontinuerlig konfetti
    setInterval(createConfetti, 100);

    //------------------------

    const bilde = document.getElementById("bilde");
    const lue = document.getElementById("lue");
    bilde.addEventListener("click", () => {
      lue.style.display = "grid";
    });
    const lueKnapp = document.getElementById("fjernLue");
    lueKnapp.addEventListener("click", () => {
      lue.style.display = "none";
    })

    
  </script>
</body>

</html>
